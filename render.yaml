# Render blueprint: deploys the whole app (FastAPI backend + frontend served
# by the same process) as ONE free web service.
# https://render.com/docs/blueprint-spec
services:
  - type: web
    name: fraud-detection-ai
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: cd backend && uvicorn app:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.3
